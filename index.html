<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #result {
            font-size: 10vw;
            font-weight: bold;
            color: #58a6ff;
            font-family: 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(88, 166, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="result">2</div>

    <script>
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        const resultDiv = document.getElementById('result');
        let currentNumber = 3; // 다음에 보여줄 소수
        let stepCount = 0;

        function getNextPrime(num) {
            let next = num + 1;
            while (!isPrime(next)) {
                next++;
            }
            return next;
        }

        function step() {
            resultDiv.textContent = currentNumber.toLocaleString();
            
            // 다음 소수 미리 계산
            currentNumber = getNextPrime(currentNumber);
            
            // 첫 번째 전환(2 -> 3) 이후부터 적용될 딜레이 계산
            // stepCount가 0일 때는 이 함수가 첫 번째 호출이므로, 다음 턴부터 적용됨
            let delay = Math.max(5, 10000 * Math.exp(-stepCount / 50));
            stepCount++;

            setTimeout(step, delay);
        }

        // 브라우저 렌더링 완성 직후, 정확한 타이머 인터벌을 위해 
        // 화면에 '2'가 확실히 고정된 상태로 딱 10,000ms(10초)를 채우는 엄격한 방식
        window.addEventListener('load', () => {
            const startTime = Date.now();
            const targetDuration = 10000; // 정확히 10초

            function checkInitialDelay() {
                const elapsedTime = Date.now() - startTime;
                if (elapsedTime >= targetDuration) {
                    // 10초가 경과했으면 첫 번째 변환 실행 및 이후 루프 시작
                    step();
                } else {
                    // 아직 10초가 안 되었다면 남은 시간 동안 재확인 (정밀 제어)
                    requestAnimationFrame(checkInitialDelay);
                }
            }

            requestAnimationFrame(checkInitialDelay);
        });
    </script>
</body>
</html>
