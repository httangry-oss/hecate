<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime</title>
    <!-- 코딩 폰트 적용을 위한 Google Fonts (Fira Code) 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #result {
            font-size: 10vw;
            font-weight: bold;
            color: #58a6ff;
            /* 윈도우/맥의 대표적인 코딩 폰트(Consolas, Fira Code, Monaco 등) 우선순위 적용 */
            font-family: 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(88, 166, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="result">2</div>

    <script>
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        const resultDiv = document.getElementById('result');
        let currentNumber = 2;

        function getNextPrime(num) {
            let next = num + 1;
            while (!isPrime(next)) {
                next++;
            }
            return next;
        }

        function step() {
            resultDiv.textContent = currentNumber.toLocaleString();
            
            // 처음엔 느리게, 숫자가 커질수록 점점 빠르게(가속) 변환되도록 수정
            let delay = Math.max(5, 300 - Math.log10(currentNumber) * 70);

            currentNumber = getNextPrime(currentNumber);
