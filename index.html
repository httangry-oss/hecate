<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 소수 생성기</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            color: #8b949e;
            font-size: 1.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        #result {
            font-size: 5vw;
            font-weight: bold;
            color: #58a6ff;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.4);
            text-align: center;
        }
        #subtext {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <h1>REAL-TIME PRIME GENERATOR</h1>
    <div id="result">2</div>
    <div id="subtext">검사 중인 숫자: 2</div>

    <script>
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        const resultDiv = document.getElementById('result');
        const subtextDiv = document.getElementById('subtext');
        let currentNumber = 2;

        function step() {
            // 소수인지 판별
            if (isPrime(currentNumber)) {
                resultDiv.textContent = currentNumber.toLocaleString();
            }
            subtextDiv.textContent = `검사 중인 숫자: ${currentNumber.toLocaleString()}`;

            // 숫자가 커질수록 대기 시간(딜레이)을 길게 만듦 (점점 느려짐)
            // 예: 숫자가 억(100,000,000) 단위가 되면 비선형적으로 대기 시간이 늘어납니다.
            let delay = 10 + Math.log10(currentNumber) * 15; 

            currentNumber++;

            // 다음 실행 예약
            setTimeout(step, delay);
        }

        // 최초 실행
        setTimeout(step, 50);
    </script>
</body>
</html>
