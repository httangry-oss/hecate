<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Prime Numbers</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #result {
            font-size: 10vw;
            font-weight: bold;
            color: #58a6ff;
            text-shadow: 0 0 30px rgba(88, 166, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="result">2</div>

    <script>
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        const resultDiv = document.getElementById('result');
        let currentNumber = 2;

        function getNextPrime(num) {
            let next = num + 1;
            while (!isPrime(next)) {
                next++;
            }
            return next;
        }

        function step() {
            resultDiv.textContent = currentNumber.toLocaleString();
            
            // 숫자가 커질수록 속도가 점점 느려지도록 대기 시간 조절
            let delay = 30 + Math.log10(currentNumber) * 15;

            currentNumber = getNextPrime(currentNumber);
            setTimeout(step, delay);
        }

        // 실행 시작
        setTimeout(step, 100);
    </script>
</body>
</html>
