<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 소수 생성기</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #c9d1d9;
            font-size: 1.5rem;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        #result {
            font-size: 1.2rem;
            line-height: 1.6;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>Real-time Prime Numbers</h1>
    <div id="result"></div>

    <script>
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        const resultDiv = document.getElementById('result');
        let currentNumber = 2;

        function findPrimes() {
            // 브라우저 멈춤 현상을 방지하기 위해 한 턴에 20개씩 빠르게 계산
            let output = "";
            for (let i = 0; i < 20; i++) {
                if (isPrime(currentNumber)) {
                    output += currentNumber + ", ";
                }
                currentNumber++;
            }
            resultDiv.innerHTML += output;
            window.scrollTo(0, document.body.scrollHeight); // 화면이 아래로 자동 스크롤
        }

        // 30밀리초(0.03초)마다 반복 실행
        setInterval(findPrimes, 30);
    </script>
</body>
</html>
