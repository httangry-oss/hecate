<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #result {
            font-size: 10vw;
            font-weight: bold;
            color: #58a6ff;
            font-family: 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(88, 166, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="result">2</div>

    <script>
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        const resultDiv = document.getElementById('result');
        let currentNumber = 3; // 다음에 보여줄 숫자를 미리 3으로 설정
        let stepCount = 0;

        function getNextPrime(num) {
            let next = num + 1;
            while (!isPrime(next)) {
                next++;
            }
            return next;
        }

        function step() {
            // 이번에 보여줄 숫자를 화면에 렌더링
            resultDiv.textContent = currentNumber.toLocaleString();
            
            // 다음 숫자를 미리 계산
            currentNumber = getNextPrime(currentNumber);
            
            // 이번 회차의 딜레이 계산 (첫 턴은 10,000ms = 10초)
            let delay = Math.max(5, 10000 * Math.exp(-stepCount / 50));
            stepCount++;

            setTimeout(step, delay);
        }

        // 페이지가 열리고 화면에 '2'가 확실히 그려진 직후, 딱 10초 뒤에 첫 step(3으로 변환) 실행
        setTimeout(() => {
            step();
        }, 10000);
    </script>
</body>
</html>
