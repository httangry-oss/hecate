<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #result {
            font-size: 10vw;
            font-weight: bold;
            color: #58a6ff;
            font-family: 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(88, 166, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="result">2</div>

    <script>
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        let currentNumber = 2;
        let stepCount = 0;

        function getNextPrime(num) {
            let next = num + 1;
            while (!isPrime(next)) {
                next++;
            }
            return next;
        }

        function step() {
            const resultDiv = document.getElementById('result');
            if (!resultDiv) {
                console.error("result 요소를 찾을 수 없습니다.");
                return;
            }

            resultDiv.textContent = currentNumber.toLocaleString();
            
            let delay = Math.max(5, 400 * Math.exp(-stepCount / 100));

            stepCount++;
            currentNumber = getNextPrime(currentNumber);
            
            setTimeout(step, delay);
        }

        // DOM이 완전히 로드된 후 실행되도록 보장
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(step, 100);
        });
    </script>
</body>
</html>
